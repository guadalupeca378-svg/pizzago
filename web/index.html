<!DOCTYPE html>
<html lang="es-MX">
<head>
  <!-- Flutter reemplaza este valor con el de --base-href al compilar. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PizzaGo: pide tu pizza en minutos.">
  <meta name="theme-color" content="#D0331F">

  <!-- Instalación en iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PizzaGo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>PizzaGo</title>
</head>
<body>
  <noscript>PizzaGo necesita JavaScript activado para funcionar.</noscript>
  <script>
    // Registra el service worker que permite abrir la aplicación sin conexión.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
